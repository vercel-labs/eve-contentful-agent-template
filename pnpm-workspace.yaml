allowBuilds:
  lefthook: true
ignoredOptionalDependencies:
  - "@mongodb-js/zstd"
  - node-liblzma
minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - ai
  - eve
  - "@eve/*"
  - "@vercel/*"
overrides:
  # Patch the undici 7.x copies for the advisories fixed in 7.30.1, such as GHSA-rfgv-xxqx-mfg5 and GHSA-2m5v-pch6-74hx.
  # just-bash pins guarded-fetch 0.1.3, which pins undici 7.29.0, and @vercel/sandbox 3.5.1 resolves 7.30.0.
  # Scoped per parent so eve's own undici 8.x copy keeps its version. Remove each once its parent ships a patched undici.
  "guarded-fetch>undici": 7.30.2
  "@vercel/sandbox>undici": 7.30.2
